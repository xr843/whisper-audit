[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-audit"
version = "0.4.1"
description = "Chinese long-audio transcription with coverage auditing, targeted re-transcription, speaker diarization and a built-in CER harness"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xr843" }]
keywords = ["asr", "speech-recognition", "transcription", "chinese", "whisper",
            "funasr", "paraformer", "subtitles", "cer", "diarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# 核心依赖必须纯 CPU 可装——ASR 后端走 extras，否则 CI 装不动。
dependencies = [
    "opencc-python-reimplemented>=0.1.7",
    "pypinyin>=0.53",
    "rapidfuzz>=3.9",
    "jieba>=0.42",
    "numpy>=1.24",
    "scikit-learn>=1.3",   # 说话人分离的凝聚聚类；纯 CPU，CI 装得动
]

[project.optional-dependencies]
# whisper 引擎本体。CTranslate2 不打包 CUDA 运行时，GPU 用户还要 [cuda]——
# 2026-08-07 冷启动实测：只装 [whisper] 在干净 GPU 机上必然
# `RuntimeError: Library libcublas.so.12 is not found`。开发机不暴露，
# 因为那里另装了 torch 顺带把库带进来了。
whisper = ["faster-whisper>=1.1.0", "ctranslate2>=4.5,<5"]
# CUDA 12 运行时。单独成 extra 而不是塞进 whisper：这两个 wheel 近 700MB，
# 纯 CPU 用户和已有 torch 的用户都不该被迫下载。
# cudnn 锁 9.x：CTranslate2 4.x 编译时链的就是 cuDNN 9，装 10 会找不到符号。
cuda = ['nvidia-cublas-cu12; platform_system == "Linux"',
        'nvidia-cudnn-cu12>=9,<10; platform_system == "Linux"']
funasr = ["funasr>=1.1.0"]
# ⚠ qwen-asr 把 transformers 钉成 ==4.57.6（精确等号），并硬依赖 gradio + flask。
# 装它会**强制降级**环境里已有的 transformers。已实测降级后 whisper 与 funasr
# 仍正常，但如果你的环境还有别的东西需要新版 transformers，请单独建 venv。
qwen = ["qwen-asr>=0.0.6"]
# socks：huggingface_hub 换 httpx 后，走 SOCKS 代理下载模型必须额外装 socksio，
# 否则报 "Using SOCKS proxy, but the 'socksio' package is not installed"。
socks = ["socksio>=1.0"]
# 本地网页界面（whisper-audit ui）。gradio 较重，故独立成 extra
# socksio：SOCKS 代理环境（国内常态）下 httpx 会预初始化代理传输，缺它直接
# ImportError——UI 连本地自检都过不去。实测踩到，与 [socks] extra 同根因。
ui = ["gradio>=4", "socksio>=1.0"]
dev = ["pytest>=8.0", "soundfile>=0.12"]   # soundfile：float32 WAV 测试夹具

[project.urls]
Homepage = "https://github.com/xr843/whisper-audit"
Repository = "https://github.com/xr843/whisper-audit"
"实测数据" = "https://github.com/xr843/whisper-audit/blob/master/docs/measurements.md"
"踩坑记录" = "https://github.com/xr843/whisper-audit/blob/master/docs/lessons.md"

[project.scripts]
whisper-audit = "whisper_audit.cli:main"

[tool.setuptools.packages.find]
include = ["whisper_audit*"]

[tool.pytest.ini_options]
filterwarnings = [
    # jieba 内部用 pkg_resources，上游未修；不是本项目能改的
    "ignore::DeprecationWarning:jieba._compat",
    "ignore:Deprecated call to .pkg_resources.declare_namespace:DeprecationWarning",
]
