[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperaudit"
version = "0.3.0"
description = "Chinese long-audio transcription with coverage auditing, targeted re-transcription, speaker diarization and a built-in CER harness"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xr843" }]
keywords = ["asr", "speech-recognition", "transcription", "chinese", "whisper",
            "funasr", "paraformer", "subtitles", "cer", "diarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# 核心依赖必须纯 CPU 可装——ASR 后端走 extras，否则 CI 装不动。
dependencies = [
    "opencc-python-reimplemented>=0.1.7",
    "pypinyin>=0.53",
    "rapidfuzz>=3.9",
    "jieba>=0.42",
    "numpy>=1.24",
    "scikit-learn>=1.3",   # 说话人分离的凝聚聚类；纯 CPU，CI 装得动
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0", "ctranslate2>=4.5,<5"]
funasr = ["funasr>=1.1.0"]
qwen = ["qwen-asr>=0.0.6"]
dev = ["pytest>=8.0", "soundfile>=0.12"]   # soundfile：float32 WAV 测试夹具

[project.urls]
Homepage = "https://github.com/xr843/whisperaudit"
Repository = "https://github.com/xr843/whisperaudit"
"实测数据" = "https://github.com/xr843/whisperaudit/blob/master/docs/measurements.md"
"踩坑记录" = "https://github.com/xr843/whisperaudit/blob/master/docs/lessons.md"

[project.scripts]
whisperaudit = "whisperaudit.cli:main"

[tool.setuptools.packages.find]
include = ["whisperaudit*"]

[tool.pytest.ini_options]
filterwarnings = [
    # jieba 内部用 pkg_resources，上游未修；不是本项目能改的
    "ignore::DeprecationWarning:jieba._compat",
    "ignore:Deprecated call to .pkg_resources.declare_namespace:DeprecationWarning",
]
